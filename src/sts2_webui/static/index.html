<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sts2 pod</title>
<style>
  :root {
    --bg: #16181d; --panel: #1e2128; --line: #2c3038; --fg: #cfd3da; --dim: #7c828d;
    --green: #66bb6a; --red: #ef5350; --amber: #ffb74d; --blue: #64b5f6; --purple: #b39ddb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  header { display: flex; gap: 24px; align-items: baseline; padding: 10px 16px;
           border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header .stat b { color: var(--fg); font-size: 15px; }
  header .stat span { color: var(--dim); font-size: 11px; margin-right: 4px; }
  nav { display: flex; gap: 2px; padding: 8px 16px 0; }
  nav button { background: none; border: 1px solid var(--line); border-bottom: none;
               color: var(--dim); padding: 5px 14px; cursor: pointer; border-radius: 6px 6px 0 0;
               font: inherit; }
  nav button.on { color: var(--fg); background: var(--panel); }
  main { padding: 12px 16px; }
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; color: var(--dim); font-weight: normal; font-size: 11px;
       padding: 4px 10px 4px 0; border-bottom: 1px solid var(--line); }
  td { padding: 5px 10px 5px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tr.row:hover { background: var(--panel); cursor: pointer; }
  .b { display: inline-block; padding: 0 7px; border-radius: 8px; font-size: 11px; }
  .victory  { background: #1d3320; color: var(--green); }
  .defeat   { background: #33201d; color: var(--red); }
  .active, .running { background: #1d2733; color: var(--blue); }
  .abandoned, .stalled { background: #2c2c2c; color: var(--dim); }
  .error, .crash { background: #33201d; color: var(--red); }
  .finished { background: #1d3320; color: var(--green); }
  .cap { background: #332b1d; color: var(--amber); }
  .dim { color: var(--dim); }
  /* replay */
  #replay { display: none; grid-template-columns: minmax(0,1fr) 300px; gap: 14px; }
  #replay.on { display: grid; }
  #obs { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
         padding: 12px 14px; white-space: pre-wrap; word-break: break-word; min-height: 300px; }
  aside { display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .nav2 { display: flex; gap: 6px; align-items: center; }
  .nav2 button { background: var(--line); color: var(--fg); border: none; border-radius: 6px;
                 padding: 4px 12px; cursor: pointer; font: inherit; }
  input[type=range] { width: 100%; accent-color: var(--blue); }
  .act { color: var(--blue); word-break: break-all; white-space: pre-wrap; }
  .rej { color: var(--red); font-size: 12px; white-space: pre-wrap; }
  #podview details { margin-bottom: 8px; }
  #podview summary { cursor: pointer; color: var(--blue); }
  #podview pre { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
                 padding: 10px 12px; white-space: pre-wrap; word-break: break-word; }
  a { color: var(--blue); text-decoration: none; }
</style>
</head>
<body>
<header id="stats"></header>
<nav>
  <button id="t-runs" class="on">runs</button>
  <button id="t-sessions">sessions</button>
  <button id="t-pod">pod</button>
</nav>
<main>
  <div id="v-runs">
    <table id="runs"></table>
    <div id="replay" style="margin-top:14px">
      <div id="obs"></div>
      <aside>
        <div class="card nav2">
          <button id="prev">◀</button>
          <span id="pos" style="min-width:80px;text-align:center"></span>
          <button id="next">▶</button>
        </div>
        <div class="card"><input type="range" id="slider" min="0" max="0" value="0"></div>
        <div class="card"><div class="dim" style="font-size:11px">action</div><div class="act" id="action"></div></div>
        <div class="card" id="rejbox" style="display:none"><div class="dim" style="font-size:11px">rejected</div><div class="rej" id="rej"></div></div>
      </aside>
    </div>
  </div>
  <div id="v-sessions" style="display:none"><table id="sessions"></table></div>
  <div id="v-pod" style="display:none"><div id="podview"></div></div>
</main>

<script src="https://spire-codex.com/widget/spire-codex-tooltip.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmtT = (ms) => ms ? new Date(ms < 1e12 ? ms * 1000 : ms).toISOString().slice(5, 16).replace("T", " ") : "";
const dur = (a, b) => (a && b) ? Math.round((b - a) / (a < 1e12 ? 1 : 1000)) + "s" : "";

// wrap entity names in [[type:Name]] so the spire-codex widget tooltips them
function tooltipify(text) {
  return text
    .split("\n").map(line => {
      let m;
      if ((m = line.match(/^(\s*\d+: )(.+?)( \(cost:.*)$/)))
        return m[1] + "[[card:" + m[2] + "]]" + m[3];
      if ((m = line.match(/^(\s*\d+: )(.+?)( HP:.*)$/)))
        return m[1] + "[[monster:" + m[2] + "]]" + m[3];
      if ((m = line.match(/^(\[Relics\] )(.*?)(  \(descriptions.*)?$/)))
        return m[1] + m[2].split(", ").map(r => {
          const n = r.replace(/\(.*$/, "").trim();
          return r.replace(n, "[[relic:" + n + "]]");
        }).join(", ") + (m[3] || "");
      if ((m = line.match(/^(\[Potions\] )(.*?)(  \(descriptions.*)?$/)))
        return m[1] + m[2].split(" | ").map(p => p.replace(/^(\d+: )(.+)$/, "$1[[potion:$2]]")).join(" | ") + (m[3] || "");
      return line;
    }).join("\n");
}

async function j(url) { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); }

// ── stats strip ──
async function loadStats() {
  const s = await j("/api/stats");
  const w = s.by_status || {};
  $("stats").innerHTML = [
    ["runs", s.runs],
    ["W-L", `${w.victory||0}-${w.defeat||0}`],
    ["wr30", s.winrate30 == null ? "—" : Math.round(s.winrate30*100)+"%"],
    ["decisions", s.decisions],
    ["illegal", s.attempts ? (100*s.illegal/s.attempts).toFixed(1)+"%" : "—"],
    ["sessions", s.sessions],
    ["tokens", ((s.tokens_in+s.tokens_out)/1e6).toFixed(1)+"M"],
    ["est cost", "$"+(s.cost_usd ?? 0).toFixed(2)],
  ].map(([k,v]) => `<div class="stat"><span>${k}</span><b>${v}</b></div>`).join("");
}

// ── runs ──
async function loadRuns() {
  const rows = await j("/api/runs");
  $("runs").innerHTML =
    "<tr><th>id</th><th>char</th><th>seed</th><th>pool</th><th>status</th><th>act/floor</th>"
    + "<th>decisions</th><th>rejected</th><th title="detail-endpoint calls: deck / piles / relics / potions / map">detail&nbsp;q</th><th>start</th><th>dur</th></tr>"
    + rows.map(r => `<tr class="row" data-id="${r.id}">
        <td class="dim">${r.id}</td><td>${esc(r.character)}</td><td class="dim">${esc(r.seed)}</td>
        <td class="dim">${r.pool}</td><td><span class="b ${r.status}">${r.status}</span></td>
        <td>${r.act ?? "–"}/${r.floor ?? "–"}</td><td>${r.n_decisions}</td>
        <td>${r.n_illegal || ""}</td><td>${r.n_detail || ""}</td>
        <td class="dim">${fmtT(r.started_at)}</td><td class="dim">${dur(r.started_at, r.ended_at)}</td>
      </tr>`).join("");
  document.querySelectorAll("#runs .row").forEach(tr =>
    tr.addEventListener("click", () => openReplay(+tr.dataset.id)));
}

// ── replay ──
let steps = [], pos = 0;
async function openReplay(runId) {
  steps = await j(`/api/runs/${runId}/decisions`);
  pos = 0;
  $("slider").max = steps.length - 1;
  $("replay").classList.add("on");
  show();
  $("replay").scrollIntoView({behavior: "smooth"});
}
function show() {
  const d = steps[pos];
  if (!d) return;
  $("pos").textContent = `${d.idx + 1} / ${steps.length}`;
  $("slider").value = pos;
  const el = $("obs");
  el.textContent = tooltipify(d.serialized);
  if (window.SpireCodex) try { SpireCodex.scan(el); } catch {}
  let act = "—";
  if (d.action) { const a = JSON.parse(d.action); act = a.action + " " + JSON.stringify(a.args ?? {}); }
  $("action").textContent = act;
  const rej = d.rejected ? JSON.parse(d.rejected) : [];
  $("rejbox").style.display = rej.length ? "" : "none";
  $("rej").textContent = rej.map(x => {
    const a = JSON.parse(x.action);
    return `${a.action} ${JSON.stringify(a.args ?? {})}\n  ✗ ${x.error ?? ""}`;
  }).join("\n");
}
$("prev").onclick = () => { if (pos > 0) { pos--; show(); } };
$("next").onclick = () => { if (pos < steps.length - 1) { pos++; show(); } };
$("slider").oninput = (e) => { pos = +e.target.value; show(); };
document.addEventListener("keydown", (e) => {
  if (!$("replay").classList.contains("on") || $("v-runs").style.display === "none") return;
  if (e.key === "ArrowLeft") $("prev").click();
  if (e.key === "ArrowRight") $("next").click();
});

// ── sessions ──
async function loadSessions() {
  const rows = await j("/api/sessions");
  $("sessions").innerHTML =
    "<tr><th>session</th><th>end</th><th>turns</th><th>tools</th><th>in</th><th>out</th><th>$</th><th>start</th><th>dur</th></tr>"
    + rows.map(s => `<tr>
        <td class="dim">${esc(s.id)}</td><td><span class="b ${s.reason}">${s.reason}</span></td>
        <td>${s.n_turns}</td><td>${s.n_tools}</td>
        <td>${(s.tokens_in/1000).toFixed(0)}k</td><td>${(s.tokens_out/1000).toFixed(1)}k</td>
        <td>${s.cost_usd.toFixed(3)}</td>
        <td class="dim">${fmtT(s.start)}</td><td class="dim">${dur(s.start, s.end)}</td>
      </tr>`).join("");
}

// ── pod files ──
async function loadPod() {
  const files = await j("/api/pod/files");
  const render = (name, content) =>
    `<details${name === "PROMPT.md" ? " open" : ""}><summary>${esc(name)}</summary><pre>${esc(content)}</pre></details>`;
  let html = "";
  for (const [k, v] of Object.entries(files)) {
    if (typeof v === "string") html += render(k, v);
    else for (const [f, c] of Object.entries(v)) html += render(k + f, c);
  }
  $("podview").innerHTML = html || '<span class="dim">empty</span>';
}

// ── tabs ──
const tabs = { runs: loadRuns, sessions: loadSessions, pod: loadPod };
for (const t of Object.keys(tabs)) {
  $("t-" + t).onclick = () => {
    for (const u of Object.keys(tabs)) {
      $("t-" + u).classList.toggle("on", u === t);
      $("v-" + u).style.display = u === t ? "" : "none";
    }
    tabs[t]();
  };
}

loadStats(); loadRuns();
setInterval(loadStats, 15000);
</script>
</body>
</html>
