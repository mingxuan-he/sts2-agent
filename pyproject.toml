[project]
name = "sts2-agent"
version = "0.1.0"
description = "LLM agents that learn to play Slay the Spire 2 (RL weights track + self-improving harness track)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# Track 2 game service (FastAPI over headless sts2-cli)
service = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
# Track 1 RL on Tinker. On this GPU-less VPS install the CPU torch wheel FIRST:
#   uv pip install torch --index-url https://download.pytorch.org/whl/cpu
rl = [
    "tinker-cookbook",
]
dev = [
    "ruff",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
