# Egress proxy for the agent pod. Allowlist-only: the pod's whole internet
# is the LLM API. This is load-bearing for the experiment — STS2 is
# post-cutoff content, and open internet access would destroy attribution
# of what the agent learned (wikis, spirebird, etc).

Port 8888
Listen 0.0.0.0
Timeout 600

# Only pod-network clients (compose network ranges)
Allow 172.16.0.0/12
Allow 10.0.0.0/8

# Domain allowlist (regex per line in the filter file); everything else 403s.
Filter "/etc/tinyproxy/filter"
FilterURLs Off
FilterDefaultDeny Yes

# HTTPS CONNECT only to 443
ConnectPort 443

LogLevel Notice
MaxClients 32
